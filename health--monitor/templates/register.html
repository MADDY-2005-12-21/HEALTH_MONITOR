<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>HealthAI — Register</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    :root{--teal:#0ABFBC;--teal-dk:#089599;--navy:#0D1B2A;--card:#111f2e;--border:rgba(10,191,188,0.16);--text:#E8F4F8;--muted:#6B8FA3;--green:#06D6A0;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'DM Sans',sans-serif;background:var(--navy);min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--text);position:relative;overflow:hidden;}
    body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(10,191,188,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(10,191,188,0.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;}
    .orb{position:fixed;border-radius:50%;filter:blur(100px);pointer-events:none;}
    .orb1{width:500px;height:500px;top:-150px;right:-150px;background:radial-gradient(circle,rgba(10,191,188,0.12),transparent 70%);}
    .orb2{width:400px;height:400px;bottom:-100px;left:-100px;background:radial-gradient(circle,rgba(6,214,160,0.08),transparent 70%);}
    .card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:44px 40px;width:100%;max-width:420px;position:relative;animation:slideUp 0.5s cubic-bezier(0.16,1,0.3,1) both;}
    @keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
    .logo-row{display:flex;align-items:center;gap:12px;margin-bottom:32px;}
    .logo-icon{width:44px;height:44px;background:linear-gradient(135deg,var(--teal),var(--green));border-radius:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px rgba(10,191,188,0.35);}
    .logo-name{font-family:'Syne',sans-serif;font-weight:800;font-size:22px;color:#fff;}
    .logo-name span{color:var(--teal);}
    h2{font-family:'Syne',sans-serif;font-weight:700;font-size:24px;letter-spacing:-0.5px;margin-bottom:6px;}
    .sub{font-size:14px;color:var(--muted);margin-bottom:30px;}
    .role-row{display:flex;gap:10px;margin-bottom:22px;}
    .role-btn{flex:1;padding:10px;border-radius:10px;border:1.5px solid var(--border);background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:all 0.2s;}
    .role-btn.selected{border-color:var(--teal);background:rgba(10,191,188,0.1);color:var(--teal);}
    .field{margin-bottom:18px;}
    .field label{display:block;font-size:12px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:8px;}
    .input-wrap{position:relative;}
    .input-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);width:16px;height:16px;}
    input[type="text"],input[type="password"]{width:100%;padding:13px 14px 13px 42px;background:var(--navy);border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;outline:none;transition:border-color 0.25s,box-shadow 0.25s;}
    input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(10,191,188,0.12);}
    input::placeholder{color:#2a4050;}
    .btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--teal),var(--teal-dk));border:none;border-radius:10px;color:#fff;font-family:'Syne',sans-serif;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 6px 20px rgba(10,191,188,0.3);transition:all 0.25s;margin-top:4px;}
    .btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(10,191,188,0.4);}
    .link-row{text-align:center;margin-top:20px;font-size:13px;color:var(--muted);}
    .link-row a{color:var(--teal);text-decoration:none;font-weight:500;}
    .link-row a:hover{text-decoration:underline;}
    .watermark{position:fixed;bottom:14px;right:18px;display:flex;align-items:center;gap:7px;z-index:9999;pointer-events:none;user-select:none;}
    .wm-dot{width:6px;height:6px;border-radius:50%;background:var(--teal);animation:pulse 1.4s ease-in-out infinite;}
    @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(10,191,188,0.5)}70%{box-shadow:0 0 0 8px rgba(10,191,188,0)}100%{box-shadow:0 0 0 0 rgba(10,191,188,0)}}
    .wm-text{font-family:'Syne',sans-serif;font-size:11px;font-weight:700;letter-spacing:0.6px;color:rgba(10,191,188,0.5);}
    .wm-text b{color:rgba(10,191,188,0.85);}
  </style>
</head>
<body>
<div class="orb orb1"></div><div class="orb orb2"></div>
<div class="card">
  <div class="logo-row">
    <div class="logo-icon"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></div>
    <div class="logo-name">Health<span>AI</span></div>
  </div>
  <h2>Create Account</h2>
  <p class="sub">Join HealthAI and start monitoring your health</p>
  <div class="role-row">
    <button type="button" class="role-btn selected" id="rP" onclick="sel('patient')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Patient</button>
    <button type="button" class="role-btn" id="rD" onclick="sel('doctor')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Doctor</button>
  </div>
  <form method="post">
    <input type="hidden" name="role" id="roleVal" value="patient"/>
    <div class="field"><label>Username</label><div class="input-wrap"><svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><input type="text" name="username" placeholder="Choose a username" required/></div></div>
    <div class="field"><label>Password</label><div class="input-wrap"><svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><input type="password" name="password" placeholder="Create a strong password" required/></div></div>
    <button type="submit" class="btn">Create Account →</button>
  </form>
  <div class="link-row">Already have an account? <a href="/">Sign In</a></div>
</div>
<div class="watermark"><div class="wm-dot"></div><div class="wm-text"><b>MADHAVAN</b> AI&amp;DS</div></div>
<script>
  function sel(r){document.getElementById('rP').classList.toggle('selected',r==='patient');document.getElementById('rD').classList.toggle('selected',r==='doctor');document.getElementById('roleVal').value=r;}
</script>
</body></html>
